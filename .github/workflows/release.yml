name: Release Windows executable

on:
  push:
    tags:
      - "v*"

permissions:
  contents: write

concurrency:
  group: release-${{ github.ref }}
  cancel-in-progress: false

jobs:
  release:
    runs-on: windows-latest

    steps:
      - name: Check out tagged commit
        uses: actions/checkout@v4

      - name: Set up Go
        uses: actions/setup-go@v5
        with:
          go-version: '1.27.x'
          cache: false

      - name: Derive release version
        shell: pwsh
        env:
          TAG_NAME: ${{ github.ref_name }}
        run: |
          $version = $env:TAG_NAME -replace '^v', ''
          if ([string]::IsNullOrWhiteSpace($version)) {
            throw "Release tag must contain a version after the leading v."
          }
          "RELEASE_VERSION=$version" | Out-File -FilePath $env:GITHUB_ENV -Encoding utf8 -Append

      - name: Build Windows executable
        shell: pwsh
        run: .\build.ps1 -Version $env:RELEASE_VERSION -Out dist

      - name: Prepare release asset
        shell: pwsh
        run: |
          $source = "dist\atlas-ap-remote.exe"
          $asset = "dist\atlas-ap-remote-windows-amd64.exe"
          if (-not (Test-Path -LiteralPath $source)) {
            throw "Build output was not found: $source"
          }
          if ((Get-Item -LiteralPath $source).Length -le 0) {
            throw "Build output is empty: $source"
          }
          Move-Item -LiteralPath $source -Destination $asset

      - name: Generate SHA256 checksum
        shell: pwsh
        run: |
          $assetName = "atlas-ap-remote-windows-amd64.exe"
          $assetPath = "dist\$assetName"
          $hash = (Get-FileHash -LiteralPath $assetPath -Algorithm SHA256).Hash.ToLowerInvariant()
          "$hash  $assetName" | Set-Content -LiteralPath "dist\$assetName.sha256" -Encoding ascii

      - name: Create GitHub Release
        shell: pwsh
        env:
          GH_TOKEN: ${{ github.token }}
        run: >-
          gh release create $env:GITHUB_REF_NAME
          dist/atlas-ap-remote-windows-amd64.exe
          dist/atlas-ap-remote-windows-amd64.exe.sha256
          --title $env:GITHUB_REF_NAME
          --generate-notes
